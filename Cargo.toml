[workspace]
members = [
    "crates/shared",
    "crates/domain",
    "crates/customers",
    "crates/loans",
    "crates/accounts",
    "crates/accounting",
    "crates/payments",
    "crates/transactions",
    "crates/charges",
    "crates/api-gateway",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Core Banking Team"]
license = "MIT"

[workspace.dependencies]
# Async
tokio = { version = "1.37", features = ["full"] }
# Web
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["trace", "cors", "compression-gzip", "auth"] }
# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "rust_decimal", "json"] }
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Errors
thiserror = "1.0"
anyhow = "1.0"
# Logging/Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Money
rust_decimal = { version = "1.34", features = ["serde-with-str", "db-postgres"] }
rust_decimal_macros = "1.34"
# UUID
uuid = { version = "1.8", features = ["v4", "serde"] }
# Time
chrono = { version = "0.4", features = ["serde"] }
# Auth
jsonwebtoken = "9.3"
bcrypt = "0.15"
# Config
config = "0.14"
# Validation
validator = { version = "0.18", features = ["derive"] }
# Testing
proptest = "1.4"
# API docs
utoipa = { version = "4.2", features = ["axum_extras", "chrono", "uuid", "decimal"] }
utoipa-swagger-ui = { version = "7.1", features = ["axum"] }
# Async trait
async-trait = "0.1"
# NATS for messaging
async-nats = "0.35"
